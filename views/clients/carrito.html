<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia La Esperanza | Carrito</title>
    <link rel="stylesheet" href="../../public/global.css">
</head>
<body>

    <header>

         <button type="button" aria-label="Volver">

            <img src="" alt="">

        </button>
        <button type="button">

            <img src="" alt="Mi cuenta">

        </button>

    </header>

    <main>

        <section id="monto-total">

            <h1 id="titulo-monto">Monto Total</h1>
            <img src="" alt="Carrito de compras">
            <p>
                <data value="200.00">$200.00</data>
            </p>
            <button type="submit">Pedir</button>
            <button type="button">Cancelar</button>

        </section>

        <section id="Agregar-producto-al-carrito">

            <form role="search">

                <label for="agregar-producto">¿Qué más deseas llevar?</label>
                <input type="search" id="agregar-producto" name="agregar-producto" placeholder="¿Qué más deseas llevar?">

                <button type="submit">
                <img src="" alt="Buscar">
                </button>

            </form>
            <button type="button" aria-label="Agregar producto">+</button>

        </section>

        <section id="productos-en-el-carrito">

            <article>

                <img src="" alt="Ibuprofeno 400mg">
                <h2>Ibuprofeno 400mg</h2>
                <p>Caja con 15 tabletas</p>
                <p>
                <data value="100.00">$100.00</data>
                </p>
                <button type="button" aria-label="Quitar una unidad de Ibuprofeno 400mg">−</button>

            </article>

            <article>

                <img src="" alt="Ibuprofeno 400mg">
                <h2>Ibuprofeno 400mg</h2>
                <p>Caja con 15 tabletas</p>
                <p>
                <data value="100.00">$100.00</data>
                </p>
                <button type="button" aria-label="Quitar una unidad de Ibuprofeno 400mg">−</button>

            </article>

        </section>

    </main>

    <footer>

        <nav aria-label="Navegación principal">
            <ul>
                <li>
                    <a href="#inicio">
                        <img src="" alt="icono de inicio">
                        Inicio
                    </a>
                </li>
                <li>
                    <a href="#medicinas">
                        <img src="" alt="icono de medicinas">
                        Medicinas
                    </a>
                </li>
                <li>
                    <a href="#pedidos">
                        <img src="" alt="icono de pedidos">
                        Pedidos
                    </a>
                </li>
                <li>
                    <a href="#escanear">
                        <img src="" alt="icono de escaneo">
                        Escanear
                    </a>
                </li>
            </ul>
        </nav>

    </footer>
    
</body>
</html>
