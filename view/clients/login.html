<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <header>

        <h1>Login</h1>

    </header>

    <main>

        <section id="login">

            <img src="" alt="Logo Farmacia La Esperanza">
            <h2>FARMACIA LA ESPERANZA</h2>

        </section>

        <form>

            <fieldset>

                <legend>Iniciar sesion</legend>

                <label for="correo">Correo Electronico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>

                <label for="contrasena">Contrasena</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="" required>
                <button type="button" aria-label="Mostrar contraseña">
                <img src="" alt="icono mostrar contraseña">
                </button>

                <p><a href="#recuperar-contrasena">¿Olvidaste tu contraseña?</a></p>

                <button type="submit">Entrar</button>

            </fieldset>

        </form>

        <section id="inicio-sesion-redes">

            <p>Iniciar sesion con</p>

            <ul>

                <li>
                <button type="button">
                    <img src="" alt="icono google">
                    Continuar con Google
                </button>
                </li>

                <li>
                <button type="button">
                    <img src="" alt="icono facebook">
                    Continuar con Facebook
                </button>
                </li>

                <li>
                <button type="button">
                    <img src="" alt="icono apple">
                    Continuar con Apple
                </button>
                </li>

            </ul>

        </section>

        <p>¿No tienes cuenta? <a href="#registro">Registrate</a></p>





    </main>

    <footer>


    </footer>
    
</body>
</html>
