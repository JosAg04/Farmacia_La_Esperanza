<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmacia La Esperanza | Login</title>
</head>
<body>

    <header>

        <a href="index.html" aria-label="Farmacia La Esperanza, volver al inicio">
            <img src="" alt="Logo Farmacia La Esperanza">
        </a>
        <h1 class="titulo-farmacia">Farmacia La Esperanza</h1>

    </header>

    <main>

        <section class="login">

            <form action="/login" method="post">

                <div class="correo-electronico">

                    <label for="correo">Correo electronico</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@gmail.com" required>

                </div>

                <div class="contrasena">
                    
                    <label for="contrasena">Contrasena</label>
                    <input type="password" id="contrasena" name="contrasena" required>

                </div>

                <a href="#">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="iniciar-sesion">Entrar</button>

            </form>

            <section class="redes-login">

                <h2 id="redes-login">O iniciar sesion con</h2>

                <ul>

                    <li>
                        <button type="submit">
                            <img src="" alt="icono google">
                            Continuar con Google
                        </button>
                    </li>

                    <li>
                        <button type="submit">
                            <img src="" alt="icono facebook">
                            Continuar con Facebook
                        </button>
                    </li>

                    <li>
                        <button type="submit">
                            <img src="" alt="icono apple">
                            Continuar con Apple
                        </button>
                    </li>

                </ul>

            </section>

            <p>No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            
        </section>


    </main>

    <footer>

        <small>Copyright 2026 Farmacia La Esperanza. Todos los derechos reservados. República Dominicana</small>

    </footer>
    
</body>
</html>
